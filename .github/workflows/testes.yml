# TESTES AUTOMÁTICOS #
# A cada push ou pull request, o GitHub roda todos os testes numa máquina dele #

name: Testes

on:
  push:
  pull_request:

# PERMISSÃO MÍNIMA #
# O CI só precisa ler o código; não pode alterar nada no repositório #
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest

    # BANCO DE TESTES #
    # Um PostgreSQL temporário, que só existe enquanto os testes rodam #
    # A senha é descartável e não tem nada a ver com a do .env #
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: boss_detector
          POSTGRES_PASSWORD: senha_de_teste
          POSTGRES_DB: boss_detector_teste
        ports:
          - 5432:5432
        # Espera o banco ficar pronto antes de começar #
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Faz o mesmo papel do .env #
    env:
      DATABASE_URL: postgresql://boss_detector:senha_de_teste@localhost:5432/boss_detector

    steps:
      # As ações ficam presas a um código exato de versão (SHA), para ninguém trocar #
      # o que elas fazem sem a gente perceber. O Dependabot atualiza esses códigos #

      # Baixa o código do repositório, sem deixar a senha do GitHub guardada na máquina #
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Instala o Python #
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      # Instala as bibliotecas do requirements.txt #
      - run: pip install -r requirements.txt

      # Roda os testes #
      - run: python -m pytest
